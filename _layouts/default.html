<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="canonical" href="{{ canonical_url }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:image" content="{{ og_image }}">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:type" content="website">

  <!-- Schema.org -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "{{ title }}",
    "description": "{{ description }}"
  }
  </script>

  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon.png' | url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | url }}">
</head>
<body data-bot-username="osminogki_montessori_bot">
  {% include 'header.html' %}

  <main>
    {{ content }}
  </main>

  {% include 'footer.html' %}
  {% include 'scripts.html' %}
</body>
</html>
